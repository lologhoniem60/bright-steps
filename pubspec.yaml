name: bright_steps
description: "Bright Steps onboarding and account screens"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/brightsteps_splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/brightsteps_splash_a12.png
  fullscreen: true
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/brightsteps_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icons/brightsteps_app_icon_foreground.png
  adaptive_icon_monochrome: assets/icons/brightsteps_app_icon_monochrome.png
  remove_alpha_ios: true